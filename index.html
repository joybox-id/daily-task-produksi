<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea">
<title>Daily Task Produksi · Joybox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23cf3f73%22/%3E%3Cpath d=%22M9 13h14v10H9zM8 10h16v3H8zM16 10v13%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f2ea; --surface:#fff; --surface-2:#faf7f2; --line:#ebe5da; --line-2:#ddd5c7;
  --ink:#1e1b16; --ink-2:#57524a; --ink-3:#8a8478;
  --accent:#cf3f73; --accent-ink:#a62a5a; --accent-soft:#fdedf3;
  --good:#0ca30c; --good-ink:#0a720a; --good-soft:#e8f6e8;
  --warn:#fab219; --warn-ink:#865800; --warn-soft:#fff5dd;
  --crit:#d03b3b; --crit-ink:#ab2828; --crit-soft:#fdeded;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --radius:16px; --shadow:0 1px 2px rgba(30,27,22,.05),0 6px 18px rgba(30,27,22,.045);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.25}
h2{font-size:20px;font-weight:800} h3{font-size:16px;font-weight:700}
p{margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap-row{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,242,234,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.topbar.emp .topbar-in{max-width:600px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{display:block;font-weight:800;font-size:15px;line-height:1.1}
.brand small{display:block;color:var(--ink-3);font-size:12px;font-weight:600}
.spacer{flex:1}
.who-mini{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:820px){
  .topbar.spv .topbar-in{flex-wrap:wrap;row-gap:8px}
  .topbar.spv .tabs{order:3;flex-basis:100%}
}

/* layout */
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 110px}
.wrap.wide{max-width:1180px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head p{margin-top:3px}
.section-title{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:22px 2px 10px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.danger{color:var(--crit-ink);border-color:#efcaca}
.btn.danger.solid{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.block{width:100%} .btn.lg{min-height:54px;font-size:16px;border-radius:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.icon-btn:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.link{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--crit-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.inp,select.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.good{background:var(--good-soft);border-color:#c9e9c9;color:var(--good-ink)}
.chip.warn{background:var(--warn-soft);border-color:#f6dfa3;color:var(--warn-ink)}
.chip.crit{background:var(--crit-soft);border-color:#f3cccc;color:var(--crit-ink)}
.chip.accent{background:var(--accent-soft);border-color:#f6cddc;color:var(--accent-ink)}
.sku{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-3);font-weight:500}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px;border:1px solid}
.banner svg{width:20px;height:20px;flex:none}
.banner.warn{background:var(--warn-soft);border-color:#f3dc9d;color:#5c3d00}
.banner.info{background:#eef4fc;border-color:#cfe0f6;color:#173f6e}
.banner .grow{flex:1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px}
.login-card .brand{justify-content:center;margin-bottom:22px}
.login-card .brand-mark{width:48px;height:48px;border-radius:14px}
.login-card .brand-mark svg{width:26px;height:26px}
.login-card .brand b{font-size:18px}
.pw-wrap{position:relative}
.pw-wrap .icon-btn{position:absolute;right:3px;top:3px}
.err{color:var(--crit-ink);font-size:13px;font-weight:600}

/* steps */
.steps{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0}
.steps li{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--line-2);flex:none}
.steps b{display:block;font-size:14px;color:inherit}
.steps small{font-size:12px}
.steps li.now{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.steps li.now .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.steps li.done{color:var(--good-ink)}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.steps .dot svg{width:15px;height:15px}

/* search & results */
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:14px;padding:0 14px;min-height:52px;background:var(--surface)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.search input{border:0;outline:0;flex:1;font-size:16px;background:transparent;min-width:0;padding:12px 0}
.results{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.res:hover{border-color:var(--line-2);background:#f5f1ea}
.res .grow{flex:1;min-width:0}
.res b{display:block;font-weight:700;font-size:15px}
.res .add{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.res .add svg{width:16px;height:16px}
.res.in .add{background:var(--good)}
.hint{padding:14px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:14px;text-align:center}
.quick-label{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin:4px 2px 6px}

/* work list */
.wl{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.wl-item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wl-item .grow{flex:1;min-width:0}
.wl-item b{display:block;font-weight:700}
.qty-pill{min-width:76px;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.qty-pill small{font-weight:600;color:var(--ink-3);font-size:12px;margin-left:3px}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:800}
.empty{padding:22px 14px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line-2);border-radius:14px;font-size:14px}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(246,242,234,0));z-index:20}
.sticky-foot .in{max-width:568px;margin:0 auto}

/* stepper */
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;color:var(--ink-2)}
.stepper button:hover{background:#f1ece3}
.stepper input{width:64px;border:0;text-align:center;font-weight:800;font-size:17px;min-height:42px;font-variant-numeric:tabular-nums;outline:none;background:var(--surface)}
.stepper.big button{width:58px;font-size:26px}
.stepper.big input{width:110px;font-size:28px;min-height:60px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chip-btn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* realization */
.ri{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.ri+.ri{margin-top:10px}
.ri.bad{border-color:#eab3b3;box-shadow:0 0 0 3px var(--crit-soft)}
.ri-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.ri-top b{display:block;font-weight:700}
.ri-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ri-label{font-weight:700;font-size:14px;color:var(--ink-2);min-width:34px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(20,18,14,.72);color:#fff;display:grid;place-items:center}
.thumb-x svg{width:13px;height:13px}
.ph-add{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;background:var(--surface-2)}
.ph-add:hover{border-color:var(--accent);color:var(--accent-ink)}
.ph-add svg{width:22px;height:22px}
.ri-hint{margin-top:8px;font-size:13px;font-weight:600}
.ri-hint.warn{color:var(--warn-ink)} .ri-hint.crit{color:var(--crit-ink)}
.done-hero{text-align:center;padding:28px 18px}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.done-ic svg{width:32px;height:32px}
.sumlist{display:flex;flex-direction:column}
.sumlist .r{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.sumlist .r:first-child{border-top:0}
.sumlist .grow{flex:1;min-width:0}

/* spv toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.datenav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.datenav input{border:0;font-weight:700;padding:6px 8px;background:transparent;min-height:34px}
.datenav .icon-btn{width:34px;height:34px}
.datelabel{font-weight:800;font-size:18px;margin-right:auto;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg-label{font-size:13px;font-weight:700;color:var(--ink-3)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .t-label{font-size:13px;font-weight:600;color:var(--ink-2)}
.tile .t-val{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.tile .t-val small{font-size:16px;color:var(--ink-3);font-weight:700}
.tile .t-sub{font-size:12px;color:var(--ink-3);margin-top:2px;display:block}

/* accordion */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:0;background:transparent}
.acc-head:hover{background:var(--surface-2)}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);flex:none;font-size:16px}
.acc-who{min-width:150px;flex:1}
.acc-who b{display:block;font-size:16px}
.acc-who .tiny{color:var(--ink-3)}
.acc-nums{display:flex;gap:22px;align-items:center}
.acc-num{display:flex;flex-direction:column;align-items:flex-end;min-width:96px}
.acc-num span{font-size:12px;color:var(--ink-3);font-weight:600}
.acc-num b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-num.dim b{color:var(--ink-3);font-weight:600}
.acc-ot{min-width:150px}
.acc-chev{width:22px;height:22px;color:var(--ink-3);transition:transform .2s;flex:none}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-badge{min-width:150px;display:flex;justify-content:flex-end}
.acc-body{display:none;border-top:1px solid var(--line);padding:16px}
.acc.open .acc-body{display:block}
@media (max-width:760px){
  .acc-head{flex-wrap:wrap;row-gap:10px}
  .acc-nums{order:4;flex-basis:100%;justify-content:flex-start;padding-left:54px}
  .acc-nums{flex-wrap:wrap;gap:10px 22px}
  .acc-num{align-items:flex-start;min-width:0}
  .acc-ot{min-width:0;flex-basis:100%}
  .acc-badge{min-width:0}
}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:700;color:var(--ink-3);text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th.num{text-align:right}
.tbl td b{font-weight:700}
.tbl .num{white-space:nowrap}
.tbl tbody tr:hover td{background:#fdfcf9}
.mini-thumbs{display:flex;gap:4px}
.mini-thumbs button{width:36px;height:36px;padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.mini-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;margin-top:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.panel h4{font-size:14px;font-weight:800;margin-bottom:10px}
.bd{width:100%;border-collapse:collapse;font-size:14px}
.bd th{font-size:12px;color:var(--ink-3);font-weight:700;text-align:right;padding:0 0 8px}
.bd th:first-child{text-align:left}
.bd td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.bd td.num{padding-left:14px;font-weight:600;white-space:nowrap}
.bd td small{display:block;color:var(--ink-3);font-size:12px;font-weight:500}
.bd tr.sum td{font-weight:800;border-top:1.5px solid var(--ink-3)}
.bd tr.sum td.num{font-weight:800}
.bd tr.ot td{font-weight:800}
.acc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}

/* charts */
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:#ece7de;stroke-width:1}
.chart .base{stroke:#cfc7b8;stroke-width:1}
.chart .tick{font-size:11px;fill:var(--ink-3);font-weight:600}
.chart .thr{stroke:var(--ink-2);stroke-width:1}
.chart .thr-lbl{font-size:11px;fill:var(--ink-2);font-weight:700}
.chart .val{font-size:12px;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}

/* modal */

.modal{background:var(--surface);border-radius:20px;width:100%;max-width:460px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.modal-body{padding:8px 18px 16px;overflow:auto}

.foot-note{font-size:12px;color:var(--ink-3);text-align:center;margin-top:18px}

<body>
<div id="app" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   DAILY TASK PRODUKSI · JOYBOX — web (GitHub Pages)
   Database: Supabase (lihat supabase/setup.sql). Semua akses lewat fungsi public.api.
   Alamat & kunci publik diatur di config.js → window.DT_CONFIG
   ===================================================================== */
const SETTINGS_DEFAULT = { efektivitas: 80, istirahatMenit: 60, jamNormal: 8, pwSuffix: '1234', fotoHari: 90 };
const CONFIG = Object.assign({ supabaseUrl: '', supabaseKey: '' }, window.DT_CONFIG || {});
CONFIG.supabaseUrl = String(CONFIG.supabaseUrl || '').replace(/\/+$/, '');
const AUTH = { token: null };
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const withTimeout = (p, ms, fallback = null) => Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);
const apiErr = (msg, code) => Object.assign(new Error(msg), { code });
async function api(action, data = {}, { timeout = 45000 } = {}) {
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) throw apiErr('Alamat server belum diatur.', 'config');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  const headers = { 'Content-Type': 'application/json', apikey: CONFIG.supabaseKey };
  if (CONFIG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CONFIG.supabaseKey;
  let res;
  try { res = await fetch(CONFIG.supabaseUrl + '/rest/v1/rpc/api', { method: 'POST', headers, signal: ctl.signal,
    body: JSON.stringify({ action, payload: Object.assign({ token: AUTH.token }, data) }) }); }
  catch (e) { throw apiErr('Koneksi ke server gagal.', 'network'); }
  finally { clearTimeout(timer); }
  if (!res.ok) throw apiErr(res.status === 404 ? 'Database belum disiapkan (setup.sql belum dijalankan).' : 'Server menolak permintaan (' + res.status + ').', 'server');
  let j; try { j = await res.json(); } catch (e) { throw apiErr('Jawaban server tidak terbaca.', 'network'); }
  if (!j.ok) { if (j.code === 'auth' && action !== 'login') setTimeout(sessionLost, 0); throw apiErr(j.error || 'Gagal.', j.code); }
  return j.data;
}
// satu pengiriman per kunci pada satu waktu; kiriman beruntun digabung jadi yang terbaru
const WQ = new Map();
function enqueue(key, send) {
  let q = WQ.get(key); if (!q) WQ.set(key, q = { busy: false, next: null, waiters: [] });
  q.next = send;
  const p = new Promise((res, rej) => q.waiters.push({ res, rej }));
  if (!q.busy) pump(q);
  return p;
}
async function pump(q) {
  q.busy = true;
  while (q.next) {
    const send = q.next, ws = q.waiters; q.next = null; q.waiters = [];
    try { const r = await send(); ws.forEach(w => w.res(r)); } catch (e) { ws.forEach(w => w.rej(e)); }
  }
  q.busy = false;
}
const Store = { entries: (from, to, userId) => api('entries', { from, to, userId: userId || null }) };
function saveErr(e) {
  const c = e && e.code;
  if (c === 'auth') return;
  toast(c === 'network' ? 'Gagal tersimpan: koneksi bermasalah. Coba lagi.' : (e && e.message) || 'Gagal menyimpan.');
}
function sessionLost() { if (!S.user) return; S.user = null; S.emp = null; AUTH.token = null; Session.set(null); renderLogin('Sesi berakhir, silakan login lagi.'); }
// foto: dikompres di HP (±80 KB) lalu disimpan di database
function loadImg(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 4000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); }; img.src = url; });
}
function drawScaled(img, max) {
  const w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c;
}
async function savePhoto(file) {
  const img = await loadImg(file);
  let q = 0.62, max = 1024, data;
  do { data = drawScaled(img, max).toDataURL('image/jpeg', q); q -= 0.08; max -= 128; } while (data.length > 160000 && q > 0.3);
  const id = await api('uploadPhoto', { data }, { timeout: 90000 });
  PHOTO_CACHE.set('g:' + id, data);
  return 'g:' + id;
}
async function deletePhoto(ref) {
  try { if (ref.startsWith('g:')) await api('deletePhoto', { id: ref.slice(2) }); } catch (e) {}
  PHOTO_CACHE.delete(ref);
}
const Session = {
  get() { try { const s = JSON.parse(localStorage.getItem('jbx_session') || 'null'); if (s && s.token && Date.now() - s.t < 12 * 3600e3) return s.token; } catch (e) {} return null; },
  set(token) { try { token ? localStorage.setItem('jbx_session', JSON.stringify({ token, t: Date.now() })) : localStorage.removeItem('jbx_session'); } catch (e) {} },
};

/* ---------- 3. UTIL ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const toDateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => new Date(s + 'T00:00:00');
const todayStr = () => toDateStr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const firstName = n => { const f = String(n || '').trim().split(/\s+/)[0] || ''; return f.charAt(0).toUpperCase() + f.slice(1); };
const fmtDateLong = s => new Intl.DateTimeFormat('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(parseDate(s));
const fmtDateMed = s => new Intl.DateTimeFormat('id-ID', {weekday:'short', day:'numeric', month:'short'}).format(parseDate(s));
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
function fmtDur(sec, exact = false) {
  sec = Math.max(0, Math.round(sec || 0));
  if (!exact && sec >= 600) sec = Math.round(sec / 60) * 60; // ringkasan: bulatkan ke menit
  if (sec >= 3600) { const m = Math.round(sec / 60), j = Math.floor(m / 60), r = m % 60; return r ? `${j} jam ${r} mnt` : `${j} jam`; }
  if (sec >= 60) { const m = Math.floor(sec / 60), d = sec % 60; return d ? `${m} mnt ${d} dtk` : `${m} mnt`; }
  return `${sec} dtk`;
}
const fmtH = sec => (Math.round((sec || 0) / 360) / 10).toLocaleString('id-ID', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' j';
const fmtNum = n => Number(n || 0).toLocaleString('id-ID');

/* ---------- 4. ICONS ---------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  logo: sv('<path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M3 5h18v4H3z"/><path d="M12 5v16"/><path d="M12 5c-1.5-2.5-5-2.5-5 0M12 5c1.5-2.5 5-2.5 5 0"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  check: sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  camera: sv('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>'),
  chev: sv('<path d="m6 9 6 6 6-6"/>'),
  left: sv('<path d="m15 6-6 6 6 6"/>'),
  right: sv('<path d="m9 6 6 6-6 6"/>'),
  out: sv('<path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>'),
  key: sv('<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l2 2"/>'),
  eye: sv('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  warn: sv('<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>'),
  clock: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  info: sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  trash: sv('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  dl: sv('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
};

/* ---------- 5. STATE & DATA ---------- */
const D = { settings: null, standards: [], products: [], users: [], pmap: new Map() };
const S = {
  user: null, emp: null,
  spv: { tab: 'ringkasan', date: todayStr(), basis: 'plan', open: new Set(), day: new Map(),
         g: { uid: null, range: 14, basis: 'plan' }, prodQ: '', prodF: 'all', exFrom: addDays(todayStr(), -29), exTo: todayStr() },
};
const PHOTO_CACHE = new Map();
const getEntry = (date, userId) => api('getEntry', { date, userId });
const saveEntry = e => { const snap = clone(e); return enqueue(`e:${e.date}_${e.userId}`, () => api('saveEntry', { entry: snap })); };
const persist = e => saveEntry(e).catch(saveErr);
const saveProducts = () => { D.pmap = new Map(D.products.map(p => [p.id, p])); const list = clone(D.products); return enqueue('products', () => api('saveProducts', { list })).catch(saveErr); };
const saveStandards = () => { const list = clone(D.standards); return enqueue('standards', () => api('saveStandards', { list })).catch(saveErr); };
const saveSettings = () => api('saveSettings', { settings: D.settings });
const defaultPw = nama => firstName(nama) + (D.settings.pwSuffix ?? '1234');
const karyawanList = (all = false) => D.users.filter(u => u.role === 'karyawan' && (all || u.aktif !== false)).sort((a, b) => a.nama.localeCompare(b.nama));
const userById = id => D.users.find(u => u.id === id);
async function loadAll() {
  const b = await api('bootstrap');
  D.settings = Object.assign({}, SETTINGS_DEFAULT, b.settings || {});
  D.standards = b.standards || []; D.products = b.products || [];
  D.pmap = new Map(D.products.map(p => [p.id, p])); D.users = b.users || []; D.sheetUrl = b.sheetUrl || null;
  let me = D.users.find(u => u.id === b.me.id); if (!me) { me = b.me; D.users.push(me); }
  S.user = me;
  return true;
}
async function rangeMap(from, to) { const list = await Store.entries(from, to); return new Map(list.map(e => [`${e.date}_${e.userId}`, e])); }

/* ---------- 6. PERHITUNGAN WLA ---------- */
const stdById = id => D.standards.find(s => s.id === id);
const stdSec = s => s ? s.komponen.reduce((a, c) => a + (Number(c.detik) || 0), 0) : 0;
function unitSec(p) { if (!p || !p.std) return null; const s = stdById(p.std); if (!s) return null; return stdSec(s) * (Number(p.mult) || 1); }
// basis 'plan' = rencana pagi, 'real' = realisasi sore
function itemQty(it, basis) { return basis === 'plan' ? (it.extra ? 0 : Number(it.qty) || 0) : (Number(it.qtyReal) || 0); }
function calc(entry, basis) {
  const r = { prod: 0, nonEff: 0, work: 0, brk: 0, total: 0, ot: 0, qty: 0, unmapped: [], has: false, ok: false };
  if (!entry) return r;
  if (basis === 'plan' && entry.status === 'draft') return r;
  if (basis === 'real' && entry.status !== 'done') return r;
  for (const it of entry.items) {
    const q = itemQty(it, basis); if (!q) continue;
    r.qty += q; r.has = true;
    const u = unitSec(D.pmap.get(it.pid));
    if (u == null) { r.unmapped.push(it.pid); continue; }
    r.prod += u * q;
  }
  if (r.prod > 0) {
    const e = Math.min(100, Math.max(1, Number(D.settings.efektivitas) || 80)) / 100;
    r.work = r.prod / e; r.nonEff = r.work - r.prod;
    r.brk = (Number(D.settings.istirahatMenit) || 0) * 60;
    r.total = r.work + r.brk;
    r.ot = Math.max(0, r.total - (Number(D.settings.jamNormal) || 8) * 3600);
    r.ok = true;
  }
  return r;
}

/* ---------- 7. UI HELPERS ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function openModal({ title, body, actions = [], onOpen, onClose, cls = '', sheet = false }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap' + (sheet ? ' sheet' : '');
  wrap.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close aria-label="Tutup">${I.x}</button></div>
    <div class="modal-body">${body}</div>
    ${actions.length ? `<div class="modal-foot">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || ''}" data-mi="${i}">${a.label}</button>`).join('')}</div>` : ''}</div>`;
  $('#modal-root').appendChild(wrap);
  const m = wrap.querySelector('.modal');
  let closed = false;
  const close = (reason) => { if (closed) return; closed = true; wrap.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(reason); };
  const onKey = e => { if (e.key === 'Escape') close('esc'); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', async e => {
    if (e.target === wrap || e.target.closest('[data-close]')) return close('dismiss');
    const b = e.target.closest('[data-mi]'); if (!b) return;
    const a = actions[+b.dataset.mi];
    const r = a.onClick ? await a.onClick(m, close) : undefined;
    if (r !== false) close('action');
  });
  onOpen && onOpen(m, close);
  return close;
}
function confirmDlg(title, body, okLabel = 'Ya, kirim', okCls = 'primary') {
  return new Promise(res => {
    let v = false;
    openModal({ title, body, sheet: true, onClose: () => res(v),
      actions: [{ label: 'Batal', cls: 'ghost' }, { label: okLabel, cls: okCls, onClick: () => { v = true; } }] });
  });
}
async function photoSrc(ref) {
  if (PHOTO_CACHE.has(ref)) return PHOTO_CACHE.get(ref);
  let src = '';
  if (ref.startsWith('g:')) { try { src = await api('photo', { id: ref.slice(2) }, { timeout: 60000 }); } catch (e) {} }
  if (src) PHOTO_CACHE.set(ref, src); return src;
}
async function hydratePhotos(root) {
  await Promise.all($$('img[data-ph]', root).map(async img => { if (img.getAttribute('src')) return; const d = await photoSrc(img.dataset.ph); if (d) img.src = d; }));
}
async function lightbox(ids, start = 0, title = 'Foto bukti') {
  let i = start;
  openModal({ title, cls: 'lightbox', body: `<img class="lb-img" alt="Foto bukti"><div class="lb-nav"><button type="button" class="btn sm ghost" data-lb="-1" style="color:#fff">${I.left} Sebelumnya</button><span data-lb-pos></span><button type="button" class="btn sm ghost" data-lb="1" style="color:#fff">Berikutnya ${I.right}</button></div>`,
    onOpen: async (m) => {
      const show = async () => { $('.lb-img', m).src = await photoSrc(ids[i]) || ''; $('[data-lb-pos]', m).textContent = `${i + 1} / ${ids.length}`;
        $$('[data-lb]', m).forEach(b => b.style.visibility = ids.length > 1 ? 'visible' : 'hidden'); };
      m.addEventListener('click', e => { const b = e.target.closest('[data-lb]'); if (b) { i = (i + +b.dataset.lb + ids.length) % ids.length; show(); } });
      show();
    } });
}
function saveFile(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('File CSV diunduh');
}

function searchProducts(q, limit = 40) {
  const toks = norm(q).split(' ').filter(Boolean); if (!toks.length) return [];
  const nq = norm(q);
  return D.products.filter(p => p.aktif !== false && toks.every(t => norm(p.nama + ' ' + p.sku).includes(t)))
    .sort((a, b) => (norm(a.nama).startsWith(nq) ? 0 : 1) - (norm(b.nama).startsWith(nq) ? 0 : 1) || a.nama.localeCompare(b.nama))
    .slice(0, limit);
}
async function renderEmp() {
  const u = S.user, today = todayStr();
  if (!S.emp) S.emp = { date: today, q: '' };
  const date = S.emp.date;
  app().innerHTML = topbar('emp') + '<main class="wrap"><div class="card empty">Memuat…</div></main>';
  let e; try { e = await withTimeout(getEntry(date, u.id), 40000, 'timeout'); } catch (err) { e = 'timeout'; }
  if (e === 'timeout') { app().innerHTML = topbar('emp') + '<main class="wrap"><div class="card empty">Data belum bisa dijangkau. Cek koneksi lalu <button type="button" class="link" data-act="emp-reload">coba lagi</button>.</div></main>'; return; }
  if (!e) e = { date, userId: u.id, status: 'draft', items: [], planAt: null, realAt: null };
  S.emp.entry = e;
  const pending = [], freq = new Map();
  try {
    const past = await Store.entries(addDays(today, -7), addDays(today, -1), u.id);
    past.forEach(x => { if (x.status === 'plan' && x.date >= addDays(today, -3)) pending.push(x.date); x.items.forEach(it => freq.set(it.pid, (freq.get(it.pid) || 0) + 1)); });
    pending.sort().reverse();
  } catch (err) {}
  S.emp.recent = [...freq.entries()].sort((a, b) => b[1] - a[1]).map(([pid]) => D.pmap.get(pid)).filter(p => p && p.aktif !== false).slice(0, 6);

  const isToday = date === today;
  const st = e.status;
  const steps = `<ol class="steps">
    <li class="${st === 'draft' ? 'now' : 'done'}"><span class="dot">${st === 'draft' ? '1' : I.check}</span><span><b>Rencana</b><small>${e.planAt ? 'Terkirim ' + fmtTime(e.planAt) : 'Pagi hari'}</small></span></li>

  const pend = pending.filter(d => d !== date).map(d => `<div class="banner warn">${I.clock}<span class="grow">Realisasi <b>${esc(fmtDateLong(d))}</b> belum diisi.</span><button type="button" class="btn sm" data-act="emp-date" data-date="${d}">Isi sekarang</button></div>`).join('');
  const back = !isToday ? `<div class="banner info">${I.info}<span class="grow">Kamu sedang mengisi untuk <b>${esc(fmtDateLong(date))}</b>.</span><button type="button" class="btn sm" data-act="emp-date" data-date="${today}">Ke hari ini</button></div>` : '';

  let body = '';
  if (st === 'draft' && isToday) body = empPlanHtml(e);
  else if (st === 'draft') body = `<div class="card"><p class="muted">Rencana untuk tanggal ini tidak dikirim.</p></div>`;
  else if (st === 'plan') body = empRealHtml(e);
  else body = empDoneHtml(e);

  app().innerHTML = topbar('emp') + `<main class="wrap">${storeBanner()}${pwBanner()}${pend}${back}
    <p class="muted small" style="margin:0 2px 10px">Halo, <b>${esc(firstName(u.nama))}</b> · ${esc(fmtDateLong(date))}</p>${steps}${body}</main>`;
  if (st === 'draft' && isToday) { renderResults(); renderWorklist(); }

}

function seriesFrom(map, userId, endDate, n, basis) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const d = addDays(endDate, -i), c = calc(map.get(`${d}_${userId}`), basis), dt = parseDate(d);
    out.push({ date: d, label: `${dt.getDate()}/${dt.getMonth() + 1}`, segs: [c.prod, c.nonEff, c.brk], total: c.total, ot: c.ot, ok: c.ok }); }
  return out;
}
const SERIES = [['Waktu produktif', 'var(--s1)'], ['Tidak efektif', 'var(--s2)'], ['Istirahat', 'var(--s3)']];
const legendHtml = () => SERIES.map(([l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('') + `<span><i style="background:none;border-top:1.5px solid var(--ink-2);border-radius:0;height:0;width:16px;vertical-align:3px"></i>Jam normal ${D.settings.jamNormal} j</span>`;

/* ---------- 11. GRAFIK (SVG) ---------- */
const CHARTS = new Map();
function registerChart(el, fn) { CHARTS.set(el, fn); fn(); }
window.addEventListener('resize', debounce(() => { for (const [el, fn] of CHARTS) { if (!document.body.contains(el)) CHARTS.delete(el); else fn(); } }, 150));
function topRound(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h}Z`; }
function rightRound(x, y, w, h, r) { r = Math.min(r, w, h / 2); return `M${x},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}H${x}Z`; }
function niceTop(maxH) { const step = maxH > 16 ? 4 : 2; return { step, top: Math.ceil(maxH / step) * step }; }
function drawStacked(el, days, { h = 240 } = {}) {
  const W = Math.max(280, Math.floor(el.clientWidth || 600)), H = h, m = { l: 34, r: 8, t: 28, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, thr = Number(D.settings.jamNormal) || 8;
  const { step, top } = niceTop(Math.max(thr + 1, ...days.map(d => d.total / 3600)));
  const Y = v => m.t + ih - (v / top) * ih;
  const n = days.length, band = iw / n, bw = Math.max(6, Math.min(24, band * 0.62)), every = Math.max(1, Math.ceil(34 / band));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik jam kerja per hari">`;
  for (let v = 0; v <= top; v += step) { const y = Y(v); s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" class="${v ? 'grid' : 'base'}"/><text x="${m.l - 7}" y="${y + 4}" class="tick" text-anchor="end">${v}</text>`; }
  s += `<text x="${m.l - 7}" y="${m.t - 6}" class="tick" text-anchor="end">jam</text>`;
  days.forEach((d, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2;
    s += `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" data-i="${i}"/>`;
    if ((n - 1 - i) % every === 0) s += `<text x="${cx}" y="${H - 8}" class="tick" text-anchor="middle">${d.label}</text>`;
    if (!d.ok) return;
    let cum = 0; const last = d.segs.reduce((a, v, k) => v > 0 ? k : a, -1);
    d.segs.forEach((v, k) => {
      if (v <= 0) return;
      const y0 = Y(cum / 3600), y1 = Y((cum + v) / 3600); const gap = cum > 0 ? 2 : 0; cum += v;
      const hh = y0 - gap - y1; if (hh <= 0.4) return;
      s += k === last ? `<path d="${topRound(x, y1, bw, hh, 4)}" fill="${SERIES[k][1]}" pointer-events="none"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${hh}" fill="${SERIES[k][1]}" pointer-events="none"/>`;
    });
  });
  const ty = Y(thr);
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${ty}" y2="${ty}" class="thr" pointer-events="none"/><text x="${W - m.r}" y="${ty - 5}" class="thr-lbl" text-anchor="end" pointer-events="none">Normal ${thr} j</text></svg>`;
  el.innerHTML = s;
  bindTips(el, days.map(d => `<div class="tt">${esc(fmtDateMed(d.date))}</div>` + (d.ok ? SERIES.map(([l, c], k) => `<div class="tr"><span><i style="background:${c}"></i>${l}</span><b>${fmtDur(d.segs[k])}</b></div>`).join('')
    + `<div class="sep"></div><div class="tr"><span>Total</span><b>${fmtDur(d.total)}</b></div><div class="tr"><span>Estimasi lembur</span><b>${d.ot ? fmtDur(d.ot) : '0'}</b></div>` : '<div class="tr"><span>Tidak ada data</span></div>')));
}
function drawHBars(el, rows) {
  const W = Math.max(300, Math.floor(el.clientWidth || 600)), rowH = 38, m = { l: 96, r: 64, t: 22, b: 26 };
  const H = m.t + rows.length * rowH + m.b, iw = W - m.l - m.r, thr = Number(D.settings.jamNormal) || 8;
  const { step, top } = niceTop(Math.max(thr + 1, ...rows.map(r => r.value / 3600)));
  const X = v => m.l + (v / top) * iw;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perbandingan rata-rata jam kerja per karyawan">`;
  for (let v = 0; v <= top; v += step) { const x = X(v); s += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}" class="${v ? 'grid' : 'base'}"/><text x="${x}" y="${H - 8}" class="tick" text-anchor="middle">${v} j</text>`; }
  rows.forEach((r, i) => {
    const y = m.t + i * rowH, bh = 20, by = y + (rowH - bh) / 2, w = Math.max(0, X(r.value / 3600) - m.l);
    s += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-i="${i}"/>`;
    s += `<text x="${m.l - 10}" y="${y + rowH / 2 + 4}" class="lbl" text-anchor="end" pointer-events="none">${esc(r.label)}</text>`;
    if (r.value > 0) { s += `<path d="${rightRound(m.l, by, w, bh, 4)}" fill="var(--s1)" pointer-events="none"/><text x="${m.l + w + 8}" y="${y + rowH / 2 + 4}" class="val" pointer-events="none">${fmtH(r.value)}</text>`; }
    else s += `<text x="${m.l + 6}" y="${y + rowH / 2 + 4}" class="tick" pointer-events="none">belum ada data</text>`;
  });
  const tx = X(thr);
  s += `<line x1="${tx}" x2="${tx}" y1="${m.t - 4}" y2="${H - m.b}" class="thr" pointer-events="none"/><text x="${tx}" y="${m.t - 8}" class="thr-lbl" text-anchor="middle" pointer-events="none">Normal ${thr} j</text></svg>`;
  el.innerHTML = s;
  bindTips(el, rows.map(r => `<div class="tt">${esc(r.label)}</div><div class="tr"><span>Rata-rata total / hari</span><b>${r.value ? fmtDur(r.value) : '–'}</b></div><div class="tr"><span>Hari ada data</span><b>${r.days}</b></div><div class="tr"><span>Hari lembur</span><b>${r.otDays}</b></div><div class="tr"><span>Total estimasi lembur</span><b>${r.ot ? fmtDur(r.ot) : '0'}</b></div>`));
}
function bindTips(el, tips) {
  const svg = el.querySelector('svg'); if (!svg) return;
  const show = e => { const t = e.target.closest('.hit'); svg.querySelectorAll('.hit.on').forEach(x => x !== t && x.classList.remove('on'));
    if (!t) return hideTip(); t.classList.add('on'); showTip(tips[+t.dataset.i], e.clientX, e.clientY); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { svg.querySelectorAll('.hit.on').forEach(x => x.classList.remove('on')); hideTip(); });
}
function showTip(html, x, y) {
  const t = $('#tip'); t.innerHTML = html; t.classList.add('on');
  const r = t.getBoundingClientRect(); let lx = x + 14, ly = y + 14;
  if (lx + r.width > innerWidth - 8) lx = x - r.width - 14; if (ly + r.height > innerHeight - 8) ly = y - r.height - 14;
  t.style.left = Math.max(8, lx) + 'px'; t.style.top = Math.max(8, ly) + 'px';
}
function hideTip() { $('#tip')?.classList.remove('on'); }
document.addEventListener('scroll', hideTip, { passive: true });

    actions: [{ label: 'Batal', cls: 'ghost' }, { label: 'Simpan', cls: 'primary', onClick: async m => {
      const nama = $('#np-nama', m).value.trim(), sku = $('#np-sku', m).value.trim().toUpperCase();
      if (!nama || !sku) { const e = $('.err', m); e.textContent = 'Nama dan SKU wajib diisi.'; e.hidden = false; return false; }
      D.products.push({ id: 'P' + uid(), nama, sku, std: $('#np-std', m).value || null, mult: Math.max(1, parseInt($('#np-mult', m).value, 10) || 1), asm: false, aktif: true });
      await saveProducts(); toast('Produk ditambahkan'); S.spv.prodQ = sku; renderSpvTab(); } }] });
};

// --- tab pengaturan
function tabPengaturan(main) {
  const st = D.settings, fid = stdById('FID') || D.standards[0];
  const ex = { qty: 15, unit: stdSec(fid) }; ex.prod = ex.qty * ex.unit;
  const e = (Number(st.efektivitas) || 80) / 100; ex.work = ex.prod / e; ex.non = ex.work - ex.prod;
  main.innerHTML = `<section class="card">
      <div class="card-head"><div><h3>Perhitungan workload</h3><p class="muted small">Berlaku untuk semua tanggal (dihitung ulang otomatis).</p></div></div>
      <div class="set-grid">
        <label class="field">Efektivitas kerja (%)<input class="inp" type="number" min="1" max="100" value="${st.efektivitas}" data-chg="set" data-k="efektivitas"><small>Bagian waktu kerja yang benar-benar produktif. Sisanya dihitung sebagai waktu tidak efektif.</small></label>
        <label class="field">Istirahat per hari (menit)<input class="inp" type="number" min="0" value="${st.istirahatMenit}" data-chg="set" data-k="istirahatMenit"><small>Ditambahkan ke total jam kerja.</small></label>
        <label class="field">Jam kerja normal per hari (jam)<input class="inp" type="number" min="1" step="0.5" value="${st.jamNormal}" data-chg="set" data-k="jamNormal"><small>Sudah termasuk istirahat. Total di atas angka ini = estimasi hak lembur.</small></label>
      </div>
      <div class="calc-ex"><b>Contoh: ${esc(fid.nama)} ${ex.qty} pcs</b>
        <ol><li>Waktu produktif: ${fmtDur(ex.unit, true)} × ${ex.qty} = <b>${fmtDur(ex.prod, true)}</b></li>
          <li>Waktu kerja (÷ ${st.efektivitas}%): ${fmtDur(ex.prod, true)} ÷ ${(e).toLocaleString('id-ID')} = <b>${fmtDur(ex.work, true)}</b>, jadi waktu tidak efektif <b>${fmtDur(ex.non, true)}</b></li>
          <li>Ditambah istirahat ${st.istirahatMenit} mnt → total <b>${fmtDur(ex.work + st.istirahatMenit * 60, true)}</b></li>
          <li>Kalau total sehari > ${st.jamNormal} jam, kelebihannya = estimasi hak lembur (mis. total 10 jam → lembur ${Math.max(0, 10 - st.jamNormal)} jam).</li></ol></div>
    </section>
    <section class="card">
      <h3 style="margin-bottom:12px">Akun & foto</h3>
      <div class="set-grid"><label class="field">Simpan foto bukti (hari)<input class="inp" type="number" min="7" value="${st.fotoHari}" data-chg="set" data-k="fotoHari"><small>Foto yang lebih lama dari ini dihapus otomatis supaya penyimpanan tidak penuh. Data jumlahnya tetap tersimpan.</small></label>
        <label class="field">Akhiran password awal<input class="inp" value="${esc(st.pwSuffix)}" data-chg="set" data-k="pwSuffix"><small>Password awal = nama depan + akhiran ini (contoh <code>${esc(defaultPw('Ulis'))}</code>). Berlaku untuk akun baru & reset password.</small></label></div>
    </section>
    <section class="card">
      <h3 style="margin-bottom:4px">Ekspor data</h3><p class="muted small" style="margin-bottom:12px">File CSV bisa dibuka di Excel / Google Sheets untuk analisis WLA lebih lanjut. Waktu dalam detik & menit (bilangan bulat).</p>
      <div class="form-grid">
        <label class="field">Dari tanggal<input class="inp" type="date" value="${S.spv.exFrom}" data-chg="ex" data-k="exFrom"></label>
        <label class="field">Sampai tanggal<input class="inp" type="date" value="${S.spv.exTo}" data-chg="ex" data-k="exTo"></label>
        <button type="button" class="btn" data-act="export" data-kind="detail" style="min-height:44px">${I.dl} Detail per item</button>
        <button type="button" class="btn" data-act="export" data-kind="sum" style="min-height:44px">${I.dl} Ringkasan per hari</button>
      </div>
    </section>
    <section class="card">
      <h3 style="margin-bottom:4px">Akses & penyimpanan</h3>
      <p class="muted small">Semua data dan foto tersimpan di database <b>Supabase</b> (paket gratis: 500 MB). Foto dikecilkan sekitar 80 KB per foto dan dihapus otomatis setelah ${D.settings.fotoHari} hari. Untuk analisis, gunakan tombol ekspor CSV di atas.</p>
    </section>`;
}
CHG['set'] = async el => {
  const k = el.dataset.k; let v = el.value;
  if (k !== 'pwSuffix') { v = Number(v); if (!isFinite(v) || v < (k === 'istirahatMenit' ? 0 : k === 'fotoHari' ? 7 : 1)) { toast('Angka tidak valid'); return renderSpvTab(); } if (k === 'efektivitas') v = Math.min(100, v); }
  D.settings[k] = v; try { await saveSettings(); toast('Pengaturan disimpan'); } catch (err) { saveErr(err); } renderSpvTab();
};
CHG['ex'] = el => { S.spv[el.dataset.k] = el.value; };
ACT['export'] = async el => {
  const from = S.spv.exFrom, to = S.spv.exTo; if (!from || !to || from > to) return toast('Rentang tanggal tidak valid');
  let list; try { list = await Store.entries(from, to); } catch (err) { return toast('Data belum bisa dijangkau'); }
  list.sort((a, b) => a.date.localeCompare(b.date) || (userById(a.userId)?.nama || '').localeCompare(userById(b.userId)?.nama || ''));
  const rows = []; const mins = s => Math.round((s || 0) / 60);
  if (el.dataset.kind === 'detail') rows.push(['Tanggal', 'Karyawan', 'Username', 'SKU', 'Produk', 'Standar waktu', 'Detik per unit', 'Qty rencana', 'Detik rencana', 'Qty realisasi', 'Detik realisasi', 'Di luar rencana', 'Jumlah foto', 'Status']);
  else rows.push(['Tanggal', 'Karyawan', 'Username', 'Status', 'Jam kirim rencana', 'Jam kirim realisasi', 'Rencana: produktif (mnt)', 'Rencana: tidak efektif (mnt)', 'Rencana: istirahat (mnt)', 'Rencana: total (mnt)', 'Rencana: lembur (mnt)', 'Realisasi: produktif (mnt)', 'Realisasi: tidak efektif (mnt)', 'Realisasi: istirahat (mnt)', 'Realisasi: total (mnt)', 'Realisasi: lembur (mnt)']);
  for (const e of list) {
    const u = userById(e.userId) || { nama: '(akun dihapus)', username: '' }, d = e.date;
    if (el.dataset.kind === 'detail') {
      for (const it of e.items) { const p = D.pmap.get(it.pid) || { nama: '', sku: '' }, us = unitSec(p), sd = stdById(p.std);
        rows.push([d, u.nama, u.username, p.sku, p.nama, sd ? sd.nama : '', us ?? '', it.extra ? 0 : it.qty, us != null ? us * (it.extra ? 0 : it.qty) : '', e.status === 'done' ? it.qtyReal : '', us != null && e.status === 'done' ? us * (+it.qtyReal || 0) : '', it.extra ? 'Ya' : '', it.photos.length, e.status]); }
    } else {
      const p = calc(e, 'plan'), r = calc(e, 'real');
      rows.push([d, u.nama, u.username, e.status, fmtTime(e.planAt), fmtTime(e.realAt), mins(p.prod), mins(p.nonEff), mins(p.brk), mins(p.total), mins(p.ot), r.ok ? mins(r.prod) : '', r.ok ? mins(r.nonEff) : '', r.ok ? mins(r.brk) : '', r.ok ? mins(r.total) : '', r.ok ? mins(r.ot) : '']);
    }
  }
  if (rows.length === 1) return toast('Tidak ada data di rentang ini');
  await saveFile(`daily-task-${el.dataset.kind === 'detail' ? 'detail' : 'ringkasan'}_${from}_${to}.csv`, csv(rows));
};
/* ---------- 12. START ---------- */
function blocker(title, body) {
  app().innerHTML = `<div class="login"><div class="card login-card" style="text-align:center">
    <div class="brand"><div class="brand-mark">${I.logo}</div><div style="text-align:left"><b>Daily Task Produksi</b><small>Joybox · Workload</small></div></div>
    <h3 style="margin-bottom:8px">${title}</h3><p class="muted small">${body}</p></div></div>`;
}
(async function boot() {
  app().innerHTML = '<div class="login"><p class="muted">Memuat…</p></div>';
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return blocker('Server belum disambungkan', 'Isi supabaseUrl dan supabaseKey di file config.js.');
  const tok = Session.get();
  if (tok) {
    AUTH.token = tok;
    try { await loadAll(); return render(); }
    catch (e) {
      if (e.code !== 'auth') { AUTH.token = null; return blocker('Server belum bisa dijangkau', 'Cek koneksi internet lalu <a href="" onclick="location.reload();return false">muat ulang</a>.'); }
      AUTH.token = null; Session.set(null); S.user = null;
    }
  }
  render();
})();
</script>
</body>
</html>
